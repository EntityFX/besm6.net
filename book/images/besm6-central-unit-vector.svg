<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1800" height="1220" viewBox="0 0 1800 1220" role="img"
     aria-labelledby="title desc">
  <title id="title">Блок-схема центральной части машины БЭСМ-6</title>
  <desc id="desc">Чистовая векторная реконструкция исторической схемы: восемь блоков МОЗУ, регистры, тракт команд, арифметическое устройство и связи с УВУ.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111"/>
    </marker>
    <style>
      .frame { fill: #fff; stroke: #111; stroke-width: 3; }
      .block { fill: #fff; stroke: #111; stroke-width: 3; }
      .thin  { fill: none; stroke: #111; stroke-width: 2; }
      .wire  { fill: none; stroke: #111; stroke-width: 4; stroke-linejoin: round; stroke-linecap: square; }
      .bus   { fill: none; stroke: #111; stroke-width: 7; stroke-linejoin: round; stroke-linecap: square; }
      .arrow { marker-end: url(#arrow); }
      .label { font-family: "Segoe UI", Arial, sans-serif; font-size: 28px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .small { font-family: "Segoe UI", Arial, sans-serif; font-size: 21px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .tiny  { font-family: "Segoe UI", Arial, sans-serif; font-size: 17px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .head  { font-family: "Segoe UI", Arial, sans-serif; font-size: 38px; font-weight: 600; letter-spacing: 8px; fill: #111; text-anchor: middle; }
      .caption { font-family: "Segoe UI", Arial, sans-serif; font-size: 29px; font-weight: 600; font-style: italic; fill: #111; text-anchor: middle; }
      .abbr { font-family: "Segoe UI", Arial, sans-serif; font-size: 34px; font-weight: 650; font-style: italic; fill: #111; text-anchor: middle; dominant-baseline: middle; }
    </style>

    <g id="memory-bank">
      <rect class="block" width="125" height="170"/>
    </g>
  </defs>

  <rect class="frame" x="28" y="22" width="1744" height="1132"/>

  <!-- Main memory -->
  <text class="head" x="900" y="128">МОЗУ</text>
  <path class="wire" d="M205 170 Q205 148 225 148 H1575 Q1595 148 1595 170"/>
  <path class="bus" d="M215 183 H1585"/>

  <g transform="translate(260 215)">
    <use xlink:href="#memory-bank"/>
    <text class="label" x="62.5" y="30">0</text>
    <text class="small" x="62.5" y="78">2 мкс</text>
    <text class="tiny" x="62.5" y="137">48 + 2 к. разр.</text>
  </g>
  <g transform="translate(415 215)"><use xlink:href="#memory-bank"/><text class="label" x="62.5" y="30">1</text></g>
  <g transform="translate(570 215)"><use xlink:href="#memory-bank"/><text class="label" x="62.5" y="30">2</text></g>
  <g transform="translate(725 215)"><use xlink:href="#memory-bank"/><text class="label" x="62.5" y="30">3</text></g>
  <g transform="translate(950 215)"><use xlink:href="#memory-bank"/><text class="label" x="62.5" y="30">4</text></g>
  <g transform="translate(1105 215)"><use xlink:href="#memory-bank"/><text class="label" x="62.5" y="30">5</text></g>
  <g transform="translate(1260 215)"><use xlink:href="#memory-bank"/><text class="label" x="62.5" y="30">6</text></g>
  <g transform="translate(1415 215)"><use xlink:href="#memory-bank"/><text class="label" x="62.5" y="30">7</text></g>

  <!-- Memory-bank control taps -->
  <g class="wire">
    <path class="arrow" d="M322 183 V215"/><path class="arrow" d="M477 183 V215"/>
    <path class="arrow" d="M632 183 V215"/><path class="arrow" d="M787 183 V215"/>
    <path class="arrow" d="M1012 183 V215"/><path class="arrow" d="M1167 183 V215"/>
    <path class="arrow" d="M1322 183 V215"/><path class="arrow" d="M1477 183 V215"/>
  </g>

  <!-- Read and write data buses -->
  <path class="bus" d="M278 425 H1618"/>
  <path class="bus" d="M278 466 H1618"/>
  <g class="wire">
    <path class="arrow" d="M300 385 V425"/><path class="arrow" d="M455 385 V425"/>
    <path class="arrow" d="M610 385 V425"/><path class="arrow" d="M765 385 V425"/>
    <path class="arrow" d="M990 385 V425"/><path class="arrow" d="M1145 385 V425"/>
    <path class="arrow" d="M1300 385 V425"/><path class="arrow" d="M1455 385 V425"/>
    <path class="arrow" d="M343 466 V385"/><path class="arrow" d="M498 466 V385"/>
    <path class="arrow" d="M653 466 V385"/><path class="arrow" d="M808 466 V385"/>
    <path class="arrow" d="M1033 466 V385"/><path class="arrow" d="M1188 466 V385"/>
    <path class="arrow" d="M1343 466 V385"/><path class="arrow" d="M1498 466 V385"/>
  </g>

  <!-- External device controller -->
  <path class="bus arrow" d="M1618 425 H1683"/>
  <path class="bus arrow" d="M1683 466 H1618"/>
  <rect class="block" x="1683" y="340" width="62" height="200" rx="3"/>
  <text class="abbr" x="1714" y="440" transform="rotate(90 1714 440)">УВУ</text>

  <!-- Command read buffer -->
  <rect class="block" x="380" y="510" width="280" height="94"/>
  <line class="thin" x1="475" y1="510" x2="475" y2="604"/>
  <line class="thin" x1="380" y1="551" x2="660" y2="551"/>
  <text class="small" x="427" y="531">ЛС</text>
  <text class="abbr" x="566" y="531">БРС</text>
  <text class="small" x="566" y="577">8 регистров</text>
  <path class="wire arrow" d="M278 425 V558 H380"/>
  <path class="wire arrow" d="M520 466 V510"/>

  <!-- Instruction register -->
  <text class="abbr" x="305" y="656">РК</text>
  <rect class="block" x="360" y="628" width="435" height="52"/>
  <line class="thin" x1="435" y1="628" x2="435" y2="680"/>
  <line class="thin" x1="545" y1="628" x2="545" y2="680"/>
  <text class="small" x="397" y="654">АМ</text>
  <text class="small" x="490" y="654">Оп</text>
  <text class="small" x="670" y="654">А</text>
  <path class="wire arrow" d="M520 604 V628"/>

  <!-- Modifier registers -->
  <rect class="block" x="335" y="720" width="120" height="182"/>
  <g class="thin">
    <path d="M335 744 H455 M335 768 H455 M335 792 H455 M335 816 H455 M335 840 H455 M335 864 H455 M335 888 H455"/>
  </g>
  <text class="abbr" x="395" y="812">М</text>
  <path class="wire arrow" d="M397 680 V720"/>

  <!-- Address adder and address counter -->
  <rect class="block" x="545" y="748" width="205" height="105"/>
  <text class="abbr" x="647" y="792">СМА</text>
  <text class="tiny" x="647" y="827">сумматор адреса</text>
  <path class="wire arrow" d="M670 680 V748"/>
  <path class="wire arrow" d="M455 812 H545"/>

  <rect class="block" x="170" y="920" width="160" height="80"/>
  <text class="abbr" x="250" y="960">Сч.АС</text>
  <text class="small" x="347" y="943">+1</text>
  <path class="wire arrow" d="M250 920 V183 H205 V558"/>
  <path class="wire arrow" d="M250 1000 V1050 H647 V853"/>
  <path class="wire arrow" d="M395 902 V1050"/>

  <!-- Number and result buffers -->
  <rect class="block" x="1005" y="500" width="170" height="92"/>
  <line class="thin" x1="1005" y1="542" x2="1175" y2="542"/>
  <text class="abbr" x="1090" y="521">БРЧ</text>
  <text class="small" x="1090" y="568">4 числа</text>
  <path class="wire arrow" d="M1090 466 V500"/>

  <rect class="block" x="1260" y="500" width="270" height="170"/>
  <line class="thin" x1="1330" y1="500" x2="1330" y2="670"/>
  <line class="thin" x1="1260" y1="542" x2="1530" y2="542"/>
  <g class="thin">
    <path d="M1260 566 H1530 M1260 590 H1530 M1260 614 H1530 M1260 638 H1530"/>
  </g>
  <text class="small" x="1295" y="521">АЗ</text>
  <text class="abbr" x="1430" y="521">БРЗ</text>
  <text class="small" x="1430" y="563">8 результатов</text>
  <path class="wire arrow" d="M1400 466 V500"/>
  <path class="wire arrow" d="M1490 500 V425"/>

  <!-- Instruction and operand paths -->
  <path class="wire arrow" d="M1175 546 H1260"/>
  <path class="wire arrow" d="M900 183 V546 H1005"/>
  <path class="wire arrow" d="M1530 617 H900"/>
  <path class="wire arrow" d="M1410 670 V782"/>

  <!-- Instruction buffer and ALU -->
  <rect class="block" x="920" y="900" width="180" height="112"/>
  <g class="thin">
    <path d="M955 900 V1012 M990 900 V1012 M1025 900 V1012 M1060 900 V1012"/>
  </g>
  <text class="abbr" x="1010" y="956">БАК</text>
  <path class="wire arrow" d="M750 800 H920"/>
  <path class="wire arrow" d="M545 820 V970 H920"/>

  <rect class="block" x="1220" y="748" width="300" height="300" rx="3"/>
  <text class="abbr" x="1370" y="900">АУ</text>
  <path class="wire arrow" d="M1100 956 H1220"/>
  <path class="wire arrow" d="M1370 748 V670"/>
  <path class="wire arrow" d="M1450 748 V670"/>

  <text class="caption" x="900" y="1115">Рис. 5.1. Блок-схема центральной части машины БЭСМ-6</text>
</svg>
