<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"
     role="img" aria-labelledby="title desc" data-theme="monochrome">
  <title id="title">Блок-схема центральной части машины БЭСМ-6</title>
  <desc id="desc">Чистовая монохромная реконструкция исторической схемы: восемь блоков оперативной памяти, регистры, счётчик адреса, сумматор адреса, буферные регистры и арифметическое устройство.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10"
            markerUnits="userSpaceOnUse" orient="auto-start-reverse" overflow="visible">
      <path d="M0 0L10 5L0 10Z" fill="#111"/>
    </marker>
    <style>
      .frame{fill:#fff;stroke:#111;stroke-width:3}
      .block{fill:#fff;stroke:#111;stroke-width:3}
      .sub{fill:#fafafa;stroke:#111;stroke-width:2}
      .bus{fill:none;stroke:#111;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .wire{fill:none;stroke:#111;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .arrow{marker-end:url(#arrow)}
      .junction{fill:#111}
      .label{font-family:"Segoe UI",Arial,sans-serif;fill:#111;text-anchor:middle;dominant-baseline:middle}
      .small{font-size:17px}
      .medium{font-size:21px;font-weight:600}
      .large{font-size:28px;font-weight:700}
      .caption{font-family:"Segoe UI",Arial,sans-serif;font-size:22px;font-style:italic;fill:#111;text-anchor:middle}
    </style>
  </defs>

  <rect class="frame" x="24" y="20" width="1552" height="925"/>
  <text class="label large" x="800" y="70">МОЗУ</text>

  <!-- Control and data buses -->
  <path class="bus" d="M165 115H1375"/>
  <text class="label small" x="95" y="115">управление</text>
  <path class="bus" d="M170 340H1400"/>
  <text class="label small" x="105" y="340">чтение</text>
  <path class="bus" d="M170 385H1400"/>
  <text class="label small" x="105" y="385">запись</text>

  <!-- Eight memory banks -->
  <g>
    <g transform="translate(170 160)"><rect class="block" width="135" height="130"/><text class="label large" x="67.5" y="35">0</text><text class="label small" x="67.5" y="70">2 мкс</text><text class="label small" x="67.5" y="101">48 + 2 разр.</text></g>
    <g transform="translate(325 160)"><rect class="block" width="135" height="130"/><text class="label large" x="67.5" y="35">1</text></g>
    <g transform="translate(480 160)"><rect class="block" width="135" height="130"/><text class="label large" x="67.5" y="35">2</text></g>
    <g transform="translate(635 160)"><rect class="block" width="135" height="130"/><text class="label large" x="67.5" y="35">3</text></g>
    <g transform="translate(790 160)"><rect class="block" width="135" height="130"/><text class="label large" x="67.5" y="35">4</text></g>
    <g transform="translate(945 160)"><rect class="block" width="135" height="130"/><text class="label large" x="67.5" y="35">5</text></g>
    <g transform="translate(1100 160)"><rect class="block" width="135" height="130"/><text class="label large" x="67.5" y="35">6</text></g>
    <g transform="translate(1255 160)"><rect class="block" width="135" height="130"/><text class="label large" x="67.5" y="35">7</text></g>
  </g>

  <!-- Dedicated short arrows prevent shared-marker drift -->
  <g class="wire arrow">
    <path data-from="control-bus" data-to="mozu-0" d="M237.5 115V153"/><path data-from="control-bus" data-to="mozu-1" d="M392.5 115V153"/>
    <path data-from="control-bus" data-to="mozu-2" d="M547.5 115V153"/><path data-from="control-bus" data-to="mozu-3" d="M702.5 115V153"/>
    <path data-from="control-bus" data-to="mozu-4" d="M857.5 115V153"/><path data-from="control-bus" data-to="mozu-5" d="M1012.5 115V153"/>
    <path data-from="control-bus" data-to="mozu-6" d="M1167.5 115V153"/><path data-from="control-bus" data-to="mozu-7" d="M1322.5 115V153"/>
    <path data-from="mozu-0" data-to="read-bus" d="M220 290V333"/><path data-from="mozu-1" data-to="read-bus" d="M375 290V333"/>
    <path data-from="mozu-2" data-to="read-bus" d="M530 290V333"/><path data-from="mozu-3" data-to="read-bus" d="M685 290V333"/>
    <path data-from="mozu-4" data-to="read-bus" d="M840 290V333"/><path data-from="mozu-5" data-to="read-bus" d="M995 290V333"/>
    <path data-from="mozu-6" data-to="read-bus" d="M1150 290V333"/><path data-from="mozu-7" data-to="read-bus" d="M1305 290V333"/>
    <path data-from="write-bus" data-to="mozu-0" d="M270 378V297"/><path data-from="write-bus" data-to="mozu-1" d="M425 378V297"/>
    <path data-from="write-bus" data-to="mozu-2" d="M580 378V297"/><path data-from="write-bus" data-to="mozu-3" d="M735 378V297"/>
    <path data-from="write-bus" data-to="mozu-4" d="M890 378V297"/><path data-from="write-bus" data-to="mozu-5" d="M1045 378V297"/>
    <path data-from="write-bus" data-to="mozu-6" d="M1200 378V297"/><path data-from="write-bus" data-to="mozu-7" d="M1355 378V297"/>
  </g>

  <!-- External input/output -->
  <rect class="block" x="1460" y="275" width="72" height="150"/>
  <text class="label large" x="1496" y="350" transform="rotate(-90 1496 350)">УВУ</text>
  <path class="wire arrow" data-from="read-bus" data-to="uvu" d="M1400 340H1453"/>
  <path class="wire arrow" data-from="uvu" data-to="write-bus" d="M1460 385H1407"/>

  <!-- Instruction and address section -->
  <g>
    <rect class="block" x="250" y="445" width="300" height="95"/>
    <line class="wire" x1="335" y1="445" x2="335" y2="540"/><line class="wire" x1="420" y1="445" x2="420" y2="540"/>
    <text class="label medium" x="292" y="477">ЛС</text><text class="label large" x="442" y="477">БРС</text><text class="label small" x="442" y="515">8 регистров</text>

    <rect class="block" x="205" y="580" width="480" height="62"/>
    <line class="wire" x1="300" y1="580" x2="300" y2="642"/><line class="wire" x1="410" y1="580" x2="410" y2="642"/>
    <text class="label large" x="175" y="611">РК</text><text class="label medium" x="252" y="611">АМ</text><text class="label medium" x="355" y="611">Оп</text><text class="label medium" x="548" y="611">А</text>

    <rect class="sub" x="220" y="690" width="150" height="155"/>
    <path class="wire" d="M235 710H355M235 730H355M235 750H355M235 770H355M235 790H355M235 810H355"/>
    <text class="label large" x="295" y="780">M</text>

    <rect class="block" x="55" y="790" width="125" height="75"/>
    <text class="label medium" x="117" y="827">Сч. АС</text>

    <rect class="block" x="450" y="700" width="235" height="125"/>
    <text class="label large" x="568" y="750">СМА</text><text class="label small" x="568" y="786">сумматор адреса</text>
  </g>

  <!-- Arithmetic section -->
  <g>
    <rect class="block" x="840" y="445" width="180" height="95"/>
    <text class="label large" x="930" y="477">БРЧ</text><text class="label small" x="930" y="515">4 числа</text>

    <rect class="block" x="1110" y="430" width="245" height="145"/>
    <line class="wire" x1="1170" y1="430" x2="1170" y2="575"/>
    <text class="label medium" x="1140" y="462">АЗ</text><text class="label large" x="1260" y="462">БРЗ</text><text class="label small" x="1260" y="500">8 результатов</text>

    <rect class="sub" x="790" y="735" width="185" height="105"/>
    <path class="wire" d="M835 735V840M880 735V840M925 735V840"/>
    <text class="label large" x="882" y="790">БАК</text>

    <rect class="block" x="1100" y="675" width="300" height="190"/>
    <text class="label large" x="1250" y="770">АУ</text>
  </g>

  <!-- Lower-system interconnects: orthogonal routes with explicit endpoints -->
  <g class="wire arrow">
    <path data-from="read-bus" data-to="brs" d="M395 340V438"/>
    <path data-from="brs" data-to="rk" d="M400 540V573"/>
    <path data-from="rk-am" data-to="m" d="M252 642V683"/>
    <path data-from="counter" data-to="m" d="M117 790V755H213"/>
    <path data-from="m" data-to="counter" d="M220 820H187"/>
    <path data-from="rk-op" data-to="bak" d="M355 642V875H780V795"/>
    <path data-from="rk-a" data-to="sma" d="M548 642V693"/>
    <path data-from="sma" data-to="control-bus" d="M568 700V660H780V122"/>
    <path data-from="sma" data-to="bak" d="M685 780H783"/>
    <path data-from="bak" data-to="au" d="M975 790H1093"/>
    <path data-from="read-bus" data-to="brch" d="M930 340V438"/>
    <path data-from="brch" data-to="au" d="M930 540V640H1160V668"/>
    <path data-from="read-bus" data-to="brz" d="M1232 340V423"/>
    <path data-from="brz" data-to="au" d="M1195 575V668"/>
    <path data-from="au" data-to="brz" d="M1305 675V582"/>
    <path data-from="brz" data-to="write-bus" d="M1355 500H1425V392"/>
  </g>

  <circle class="junction" cx="395" cy="340" r="6"/><circle class="junction" cx="930" cy="340" r="6"/><circle class="junction" cx="1232" cy="340" r="6"/>
  <text class="caption" x="800" y="920">Рис. 5.1. Блок-схема центральной части машины БЭСМ-6</text>
</svg>
