<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <style>
    text { font-family: 'Courier New', monospace; font-size: 13px; fill: #333; text-anchor: middle; dominant-baseline: middle; }
    .label { font-size: 11px; fill: #666; }
    .title { font-size: 14px; font-weight: bold; fill: #222; }
  </style>
  <!-- Title -->
  <text x="400" y="20" class="title">Формат 48-битного слова БЭСМ-6 (число с плавающей точкой)</text>
  <!-- Bit ranges -->
  <text x="380" y="45" class="label">47</text>
  <text x="340" y="45" class="label">42 41</text>
  <text x="20" y="45" class="label">1</text>
  <text x="5" y="45" class="label">0</text>
  <!-- Blocks -->
  <rect x="360" y="50" width="80" height="30" rx="3" fill="#4A90D9" stroke="#2C5F8A" stroke-width="1.5"/>
  <rect x="40" y="50" width="320" height="30" rx="3" fill="#7BC47F" stroke="#4A8C4E" stroke-width="1.5"/>
  <rect x="5" y="50" width="35" height="30" rx="3" fill="#E8E8E8" stroke="#999" stroke-width="1.5"/>
  <!-- Labels -->
  <text x="400" y="68" fill="white" font-weight="bold">ПОРЯДОК</text>
  <text x="200" y="68" fill="white" font-weight="bold">МАНТИССА</text>
  <text x="22" y="68" fill="#666">—</text>
  <!-- Bottom labels -->
  <text x="400" y="95" class="label">6 бит (41-46)</text>
  <text x="200" y="95" class="label">41 бит (1-40)</text>
  <text x="22" y="95" class="label">0</text>
  <!-- Sign indicator -->
  <text x="395" y="110" class="label">↑ разряд 47 — знак мантиссы</text>
</svg>