<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #333; text-anchor: middle; dominant-baseline: middle; }
    .title { font-size: 15px; font-weight: bold; fill: #222; }
    .subtitle { font-size: 10px; fill: #666; }
    .label { font-size: 12px; fill: white; font-weight: bold; }
    .desc { font-size: 10px; fill: #E0E0E0; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrow-back" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#D0021B"/>
    </marker>
  </defs>

  <text x="400" y="25" class="title">Жизненный цикл программы для БЭСМ-6</text>

  <!-- Этап 1: Алгоритм -->
  <rect x="30" y="55" width="130" height="65" rx="8" fill="#4A90D9" stroke="#2C5F8A" stroke-width="2"/>
  <text x="95" y="78" class="label">Разработка</text>
  <text x="95" y="95" class="label">алгоритма</text>
  <text x="95" y="110" class="desc">блок-схемы, псевдокод</text>

  <!-- Arrow 1→2 -->
  <line x1="160" y1="87" x2="190" y2="87" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Этап 2: Код -->
  <rect x="195" y="55" width="130" height="65" rx="8" fill="#7BC47F" stroke="#4A8C4E" stroke-width="2"/>
  <text x="260" y="78" class="label">Написание</text>
  <text x="260" y="95" class="label">кода</text>
  <text x="260" y="110" class="desc">перфокарты, БЕМШ/Фортран</text>

  <!-- Arrow 2→3 -->
  <line x1="325" y1="87" x2="355" y2="87" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Этап 3: Трансляция -->
  <rect x="360" y="55" width="130" height="65" rx="8" fill="#F5A623" stroke="#C47A10" stroke-width="2"/>
  <text x="425" y="78" class="label">Трансляция</text>
  <text x="425" y="95" class="label">(компиляция)</text>
  <text x="425" y="110" class="desc">объектный код, листинг</text>

  <!-- Arrow 3→4 -->
  <line x1="490" y1="87" x2="520" y2="87" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Этап 4: Компоновка -->
  <rect x="525" y="55" width="130" height="65" rx="8" fill="#D0021B" stroke="#8B0010" stroke-width="2"/>
  <text x="590" y="78" class="label">Компоновка</text>
  <text x="590" y="95" class="label">(редактирование</text>
  <text x="590" y="110" class="label">связей)</text>

  <!-- Arrow 4→5 -->
  <line x1="655" y1="87" x2="685" y2="87" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Этап 5: Выполнение -->
  <rect x="690" y="55" width="100" height="65" rx="8" fill="#9B59B6" stroke="#6C3483" stroke-width="2"/>
  <text x="740" y="78" class="label">Выполнение</text>
  <text x="740" y="95" class="desc">загрузка в ОЗУ</text>

  <!-- Нижняя строка: Отладка и Анализ -->
  <!-- Стрелка вниз от Выполнение к Отладка -->
  <line x1="740" y1="120" x2="740" y2="155" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Блок Отладка -->
  <rect x="525" y="160" width="130" height="65" rx="8" fill="#D0021B" stroke="#8B0010" stroke-width="2"/>
  <text x="590" y="183" class="label">Отладка</text>
  <text x="590" y="200" class="desc">монитор, дамп, трассировка</text>

  <!-- Стрелка от Отладка к Анализ -->
  <line x1="525" y1="192" x2="495" y2="192" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Блок Анализ -->
  <rect x="360" y="160" width="130" height="65" rx="8" fill="#F5A623" stroke="#C47A10" stroke-width="2"/>
  <text x="425" y="183" class="label">Анализ</text>
  <text x="425" y="200" class="label">результата</text>

  <!-- Стрелка назад от Анализ к Написание кода -->
  <path d="M 425 160 L 425 140 L 260 140 L 260 120" fill="none" stroke="#D0021B" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-back)"/>
  <text x="340" y="135" class="subtitle" fill="#D0021B">повторная итерация (при ошибках)</text>

  <!-- Legend -->
  <rect x="30" y="260" width="740" height="45" rx="5" fill="#F5F5F5" stroke="#DDD" stroke-width="1"/>
  <text x="400" y="278" class="subtitle">Основной поток: алгоритм → код → трансляция → компоновка → выполнение</text>
  <text x="400" y="293" class="subtitle" fill="#D0021B">Обратная связь: при ошибках — возврат к написанию кода (пунктирная линия)</text>
</svg>