<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" data-theme="color" role="img" aria-labelledby="title desc">
  <title id="title">Жизненный цикл программы БЭСМ-6</title>
  <desc id="desc">От алгоритма и исходного текста через трансляцию, компоновку и загрузку к выполнению и анализу; обнаруженная ошибка возвращает работу к исходному тексту.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" overflow="visible" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 1L12 6 0 11Z" fill="#5a6475"/></marker><marker id="back" markerUnits="userSpaceOnUse" overflow="visible" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 1L12 6 0 11Z" fill="#b4494d"/></marker><style>
  text{font-family:"Segoe UI",Arial,sans-serif;text-anchor:middle;fill:#172033}.title{font-size:26px;font-weight:700}.name{font-size:16px;font-weight:700;fill:#fff}.detail{font-size:12px;fill:#eef2f7}.wire{fill:none;stroke:#5a6475;stroke-width:2.5;marker-end:url(#arrow)}.feedback{fill:none;stroke:#b4494d;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#back)}.note{font-size:14px;fill:#5a6475}
  </style></defs>
  <rect width="1120" height="540" fill="#fff"/><text class="title" x="560" y="38">Жизненный цикл программы БЭСМ-6</text>
  <g><rect x="40" y="105" width="145" height="82" rx="10" fill="#4169a8" stroke="#27466f" stroke-width="2"/><text class="name" x="112" y="137">АЛГОРИТМ</text><text class="detail" x="112" y="162">схема и расчёт</text>
  <rect x="220" y="105" width="145" height="82" rx="10" fill="#368873" stroke="#215f50" stroke-width="2"/><text class="name" x="292" y="137">ИСХОДНЫЙ ТЕКСТ</text><text class="detail" x="292" y="162">БЕМШ · MADLEN · FORTRAN</text>
  <rect x="400" y="105" width="145" height="82" rx="10" fill="#d18b28" stroke="#995f13" stroke-width="2"/><text class="name" x="472" y="137">ТРАНСЛЯЦИЯ</text><text class="detail" x="472" y="162">объектный модуль</text>
  <rect x="580" y="105" width="145" height="82" rx="10" fill="#b4494d" stroke="#7d3034" stroke-width="2"/><text class="name" x="652" y="137">КОМПОНОВКА</text><text class="detail" x="652" y="162">связи и библиотеки</text>
  <rect x="760" y="105" width="145" height="82" rx="10" fill="#76559d" stroke="#50386d" stroke-width="2"/><text class="name" x="832" y="137">ЗАГРУЗКА</text><text class="detail" x="832" y="162">размещение в памяти</text>
  <rect x="935" y="105" width="145" height="82" rx="10" fill="#4169a8" stroke="#27466f" stroke-width="2"/><text class="name" x="1007" y="137">ВЫПОЛНЕНИЕ</text><text class="detail" x="1007" y="162">процессор и устройства</text></g>
  <path class="wire" data-from="algorithm" data-to="source" data-contact="220,146" d="M185 146H220"/><path class="wire" data-from="source" data-to="translate" data-contact="400,146" d="M365 146H400"/><path class="wire" data-from="translate" data-to="link" data-contact="580,146" d="M545 146H580"/><path class="wire" data-from="link" data-to="load" data-contact="760,146" d="M725 146H760"/><path class="wire" data-from="load" data-to="execute" data-contact="935,146" d="M905 146H935"/>
  <rect x="760" y="285" width="145" height="82" rx="10" fill="#d18b28" stroke="#995f13" stroke-width="2"/><text class="name" x="832" y="317">АНАЛИЗ</text><text class="detail" x="832" y="342">вывод и результаты</text>
  <rect x="580" y="285" width="145" height="82" rx="10" fill="#b4494d" stroke="#7d3034" stroke-width="2"/><text class="name" x="652" y="317">ОТЛАДКА</text><text class="detail" x="652" y="342">трасса · дамп · диагностика</text>
