<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #333; text-anchor: middle; dominant-baseline: middle; }
    .title { font-size: 15px; font-weight: bold; fill: #222; }
    .subtitle { font-size: 10px; fill: #666; }
    .stage { font-size: 11px; fill: white; font-weight: bold; }
  </style>
  <text x="400" y="20" class="title">Конвейерная обработка команд в БЭСМ-6</text>
  <text x="400" y="35" class="subtitle">5 ступеней конвейера: параллельное выполнение разных этапов разных команд</text>

  <!-- Header: такты -->
  <text x="100" y="60" class="subtitle">Такт 1</text>
  <text x="200" y="60" class="subtitle">Такт 2</text>
  <text x="300" y="60" class="subtitle">Такт 3</text>
  <text x="400" y="60" class="subtitle">Такт 4</text>
  <text x="500" y="60" class="subtitle">Такт 5</text>
  <text x="600" y="60" class="subtitle">Такт 6</text>
  <text x="700" y="60" class="subtitle">Такт 7</text>

  <!-- Команда 1 -->
  <rect x="50" y="80" width="100" height="30" rx="3" fill="#4A90D9" stroke="#2C5F8A" stroke-width="1"/>
  <text x="100" y="98" class="stage">УУ: К1</text>
  <rect x="150" y="80" width="100" height="30" rx="3" fill="#7BC47F" stroke="#4A8C4E" stroke-width="1"/>
  <text x="200" y="98" class="stage">УВ: К1</text>
  <rect x="250" y="80" width="100" height="30" rx="3" fill="#F5A623" stroke="#C47A10" stroke-width="1"/>
  <text x="300" y="98" class="stage">АУ: К1</text>
  <rect x="350" y="80" width="100" height="30" rx="3" fill="#9B59B6" stroke="#6C3483" stroke-width="1"/>
  <text x="400" y="98" class="stage">УЗ: К1</text>
  <text x="100" y="125" class="subtitle">Команда 1 (К1)</text>

  <!-- Команда 2 -->
  <rect x="150" y="140" width="100" height="30" rx="3" fill="#4A90D9" stroke="#2C5F8A" stroke-width="1"/>
  <text x="200" y="158" class="stage">УУ: К2</text>
  <rect x="250" y="140" width="100" height="30" rx="3" fill="#7BC47F" stroke="#4A8C4E" stroke-width="1"/>
  <text x="300" y="158" class="stage">УВ: К2</text>
  <rect x="350" y="140" width="100" height="30" rx="3" fill="#F5A623" stroke="#C47A10" stroke-width="1"/>
  <text x="400" y="158" class="stage">АУ: К2</text>
  <rect x="450" y="140" width="100" height="30" rx="3" fill="#9B59B6" stroke="#6C3483" stroke-width="1"/>
  <text x="500" y="158" class="stage">УЗ: К2</text>
  <text x="200" y="185" class="subtitle">Команда 2 (К2)</text>

  <!-- Команда 3 -->
  <rect x="250" y="200" width="100" height="30" rx="3" fill="#4A90D9" stroke="#2C5F8A" stroke-width="1"/>
  <text x="300" y="218" class="stage">УУ: К3</text>
  <rect x="350" y="200" width="100" height="30" rx="3" fill="#7BC47F" stroke="#4A8C4E" stroke-width="1"/>
  <text x="400" y="218" class="stage">УВ: К3</text>
  <rect x="450" y="200" width="100" height="30" rx="3" fill="#F5A623" stroke="#C47A10" stroke-width="1"/>
  <text x="500" y="218" class="stage">АУ: К3</text>
  <rect x="550" y="200" width="100" height="30" rx="3" fill="#9B59B6" stroke="#6C3483" stroke-width="1"/>
  <text x="600" y="218" class="stage">УЗ: К3</text>
  <text x="300" y="245" class="subtitle">Команда 3 (К3)</text>

  <!-- Команда 4 -->
  <rect x="350" y="260" width="100" height="30" rx="3" fill="#4A90D9" stroke="#2C5F8A" stroke-width="1"/>
  <text x="400" y="278" class="stage">УУ: К4</text>
  <rect x="450" y="260" width="100" height="30" rx="3" fill="#7BC47F" stroke="#4A8C4E" stroke-width="1"/>
  <text x="500" y="278" class="stage">УВ: К4</text>
  <rect x="550" y="260" width="100" height="30" rx="3" fill="#F5A623" stroke="#C47A10" stroke-width="1"/>
  <text x="600" y="278" class="stage">АУ: К4</text>
  <rect x="650" y="260" width="100" height="30" rx="3" fill="#9B59B6" stroke="#6C3483" stroke-width="1"/>
  <text x="700" y="278" class="stage">УЗ: К4</text>
  <text x="400" y="305" class="subtitle">Команда 4 (К4)</text>

  <!-- Legend -->
  <text x="400" y="335" class="subtitle" fill="#888">УУ — выборка команды | УВ — чтение операндов | АУ — выполнение | УЗ — запись результата</text>
</svg>