<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" data-theme="color" role="img" aria-labelledby="title desc">
  <title id="title">Временная диаграмма конвейерного выполнения</title>
  <desc id="desc">Четыре команды проходят этапы управления, выборки, исполнения и записи со сдвигом на один такт.</desc>
  <defs><style>
    text{font-family:"Segoe UI",Arial,sans-serif;fill:#172033;text-anchor:middle}.title{font-size:26px;font-weight:700}.sub{font-size:14px;fill:#5a6475}.row{font-size:16px;font-weight:700;text-anchor:end}.stage{font-size:14px;font-weight:700;fill:#fff}.grid{stroke:#d4dae3;stroke-width:1}.cell{stroke:#172033;stroke-width:1.5}
  </style></defs>
  <rect width="1000" height="530" fill="#fff"/><text class="title" x="500" y="38">Конвейерное выполнение команд</text><text class="sub" x="500" y="62">Перекрытие этапов повышает пропускную способность</text>
  <g class="grid"><path d="M170 95H940M170 175H940M170 255H940M170 335H940M170 415H940"/><path d="M170 95V415M280 95V415M390 95V415M500 95V415M610 95V415M720 95V415M830 95V415M940 95V415"/></g>
  <g class="sub"><text x="225" y="88">такт 1</text><text x="335" y="88">такт 2</text><text x="445" y="88">такт 3</text><text x="555" y="88">такт 4</text><text x="665" y="88">такт 5</text><text x="775" y="88">такт 6</text><text x="885" y="88">такт 7</text></g>
  <text class="row" x="145" y="137">Команда 1</text><text class="row" x="145" y="217">Команда 2</text><text class="row" x="145" y="297">Команда 3</text><text class="row" x="145" y="377">Команда 4</text>
  <g><rect class="cell" x="170" y="108" width="110" height="54" fill="#4169a8"/><text class="stage" x="225" y="140">УУ</text><rect class="cell" x="280" y="108" width="110" height="54" fill="#368873"/><text class="stage" x="335" y="140">УВ</text><rect class="cell" x="390" y="108" width="110" height="54" fill="#d18b28"/><text class="stage" x="445" y="140">АУ</text><rect class="cell" x="500" y="108" width="110" height="54" fill="#76559d"/><text class="stage" x="555" y="140">УЗ</text></g>
  <g transform="translate(110 80)"><rect class="cell" x="170" y="108" width="110" height="54" fill="#4169a8"/><text class="stage" x="225" y="140">УУ</text><rect class="cell" x="280" y="108" width="110" height="54" fill="#368873"/><text class="stage" x="335" y="140">УВ</text><rect class="cell" x="390" y="108" width="110" height="54" fill="#d18b28"/><text class="stage" x="445" y="140">АУ</text><rect class="cell" x="500" y="108" width="110" height="54" fill="#76559d"/><text class="stage" x="555" y="140">УЗ</text></g>
  <g transform="translate(220 160)"><rect class="cell" x="170" y="108" width="110" height="54" fill="#4169a8"/><text class="stage" x="225" y="140">УУ</text><rect class="cell" x="280" y="108" width="110" height="54" fill="#368873"/><text class="stage" x="335" y="140">УВ</text><rect class="cell" x="390" y="108" width="110" height="54" fill="#d18b28"/><text class="stage" x="445" y="140">АУ</text><rect class="cell" x="500" y="108" width="110" height="54" fill="#76559d"/><text class="stage" x="555" y="140">УЗ</text></g>
  <g transform="translate(330 240)"><rect class="cell" x="170" y="108" width="110" height="54" fill="#4169a8"/><text class="stage" x="225" y="140">УУ</text><rect class="cell" x="280" y="108" width="110" height="54" fill="#368873"/><text class="stage" x="335" y="140">УВ</text><rect class="cell" x="390" y="108" width="110" height="54" fill="#d18b28"/><text class="stage" x="445" y="140">АУ</text><rect class="cell" x="500" y="108" width="110" height="54" fill="#76559d"/><text class="stage" x="555" y="140">УЗ</text></g>
  <g class="sub"><rect x="170" y="453" width="20" height="20" fill="#4169a8"/><text x="235" y="468">управление</text><rect x="335" y="453" width="20" height="20" fill="#368873"/><text x="390" y="468">выборка</text><rect x="485" y="453" width="20" height="20" fill="#d18b28"/><text x="540" y="468">исполнение</text><rect x="645" y="453" width="20" height="20" fill="#76559d"/><text x="695" y="468">запись</text></g>
  <text class="sub" x="500" y="510">После заполнения конвейера одна команда завершается каждый такт</text>
</svg>
