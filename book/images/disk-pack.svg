<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Consolas, monospace" font-size="12">
  <style>
    text { fill: #333; }
    .title { font-size: 14px; font-weight: bold; }
    .label { font-size: 11px; }
  </style>

  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" class="title">ПАКЕТ ДИСКОВ НМД-50</text>

  <!-- Central shaft -->
  <rect x="285" y="50" width="30" height="300" rx="3" fill="#888" stroke="#555" stroke-width="1.5"/>

  <!-- Disk platters -->
  <!-- Platter 0 -->
  <ellipse cx="300" cy="100" rx="140" ry="25" fill="#d4e6f1" stroke="#2980b9" stroke-width="1.5"/>
  <ellipse cx="300" cy="100" rx="140" ry="25" fill="none" stroke="#2980b9" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="300" y="104" text-anchor="middle" class="label">Пластина 0</text>

  <!-- Platter 1 -->
  <ellipse cx="300" cy="160" rx="140" ry="25" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <ellipse cx="300" cy="160" rx="140" ry="25" fill="none" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="300" y="164" text-anchor="middle" class="label">Пластина 1</text>

  <!-- Platter 2 -->
  <ellipse cx="300" cy="220" rx="140" ry="25" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5"/>
  <ellipse cx="300" cy="220" rx="140" ry="25" fill="none" stroke="#e67e22" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="300" y="224" text-anchor="middle" class="label">Пластина 2</text>

  <!-- Platter 3 -->
  <ellipse cx="300" cy="280" rx="140" ry="25" fill="#e8daef" stroke="#8e44ad" stroke-width="1.5"/>
  <ellipse cx="300" cy="280" rx="140" ry="25" fill="none" stroke="#8e44ad" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="300" y="284" text-anchor="middle" class="label">Пластина 3</text>

  <!-- Track labels -->
  <line x1="440" y1="100" x2="480" y2="100" stroke="#555" stroke-width="1"/>
  <text x="485" y="104" class="label">Дорожка 0</text>
  <line x1="440" y1="160" x2="480" y2="160" stroke="#555" stroke-width="1"/>
  <text x="485" y="164" class="label">Дорожка 1</text>
  <line x1="440" y1="220" x2="480" y2="220" stroke="#555" stroke-width="1"/>
  <text x="485" y="224" class="label">Дорожка 2</text>
  <line x1="440" y1="280" x2="480" y2="280" stroke="#555" stroke-width="1"/>
  <text x="485" y="284" class="label">Дорожка 3</text>

  <!-- Read/write head arm -->
  <rect x="10" y="85" width="40" height="210" rx="3" fill="#bbb" stroke="#888" stroke-width="1"/>
  <text x="30" y="200" text-anchor="middle" class="label" transform="rotate(-90,30,200)">Блок головок</text>

  <!-- Head arms to platters -->
  <line x1="50" y1="100" x2="160" y2="100" stroke="#888" stroke-width="1.5"/>
  <line x1="50" y1="160" x2="160" y2="160" stroke="#888" stroke-width="1.5"/>
  <line x1="50" y1="220" x2="160" y2="220" stroke="#888" stroke-width="1.5"/>
  <line x1="50" y1="280" x2="160" y2="280" stroke="#888" stroke-width="1.5"/>

  <!-- Head dots -->
  <circle cx="160" cy="100" r="3" fill="#e74c3c"/>
  <circle cx="160" cy="160" r="3" fill="#e74c3c"/>
  <circle cx="160" cy="220" r="3" fill="#e74c3c"/>
  <circle cx="160" cy="280" r="3" fill="#e74c3c"/>

  <!-- Spacers between platters -->
  <rect x="145" y="125" width="10" height="10" fill="#aaa" rx="1"/>
  <rect x="145" y="185" width="10" height="10" fill="#aaa" rx="1"/>
  <rect x="145" y="245" width="10" height="10" fill="#aaa" rx="1"/>

  <!-- Legend -->
  <rect x="10" y="340" width="580" height="50" rx="5" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <text x="20" y="358" class="label">Условные обозначения:</text>
  <circle cx="30" cy="372" r="4" fill="#e74c3c"/>
  <text x="40" y="376" class="label">Магнитная головка чтения/записи</text>
  <rect x="200" y="368" width="8" height="8" rx="1" fill="#888"/>
  <text x="212" y="376" class="label">Вал привода</text>
  <rect x="310" y="368" width="8" height="8" rx="1" fill="#bbb"/>
  <text x="322" y="376" class="label">Блок позиционирования головок</text>
</svg>