<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" data-theme="color" role="img" aria-labelledby="title desc">
  <title id="title">Устройство пакета магнитных дисков</title>
  <desc id="desc">Несколько магнитных пластин на общем валу, блок головок, радиальные дорожки и цилиндр с одинаковым номером дорожки на всех поверхностях.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" overflow="visible" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 1L12 6 0 11Z" fill="#5a6475"/></marker><style>
  text{font-family:"Segoe UI",Arial,sans-serif;fill:#172033}.title{font-size:26px;font-weight:700;text-anchor:middle}.label{font-size:15px}.small{font-size:13px;fill:#5a6475}.plate{fill:#dce8f7;stroke:#27466f;stroke-width:2}.track{fill:none;stroke:#6f8fb7;stroke-width:1.5}.wire{fill:none;stroke:#5a6475;stroke-width:2;marker-end:url(#arrow)}
  </style></defs>
  <rect width="900" height="600" fill="#fff"/><text class="title" x="450" y="38">Пакет магнитных дисков</text>
  <rect x="205" y="90" width="34" height="405" rx="8" fill="#7e8795" stroke="#333" stroke-width="2"/><text class="label" x="222" y="525" text-anchor="middle">общий вал</text>
  <g><ellipse class="plate" cx="370" cy="125" rx="220" ry="43"/><ellipse class="track" cx="370" cy="125" rx="150" ry="28"/><ellipse cx="370" cy="125" rx="32" ry="10" fill="#fff" stroke="#27466f" stroke-width="2"/>
  <ellipse class="plate" cx="370" cy="225" rx="220" ry="43"/><ellipse class="track" cx="370" cy="225" rx="150" ry="28"/><ellipse cx="370" cy="225" rx="32" ry="10" fill="#fff" stroke="#27466f" stroke-width="2"/>
  <ellipse class="plate" cx="370" cy="325" rx="220" ry="43"/><ellipse class="track" cx="370" cy="325" rx="150" ry="28"/><ellipse cx="370" cy="325" rx="32" ry="10" fill="#fff" stroke="#27466f" stroke-width="2"/>
  <ellipse class="plate" cx="370" cy="425" rx="220" ry="43"/><ellipse class="track" cx="370" cy="425" rx="150" ry="28"/><ellipse cx="370" cy="425" rx="32" ry="10" fill="#fff" stroke="#27466f" stroke-width="2"/></g>
  <rect x="690" y="110" width="72" height="340" rx="10" fill="#f1ca4b" stroke="#8c741d" stroke-width="2"/><text class="label" x="726" y="280" text-anchor="middle" transform="rotate(-90 726 280)">позиционер головок</text>
  <g stroke="#5a6475" stroke-width="4"><path d="M690 150H580"/><path d="M690 250H580"/><path d="M690 350H580"/><path d="M690 450H580"/></g><g fill="#b4494d"><circle cx="580" cy="150" r="7"/><circle cx="580" cy="250" r="7"/><circle cx="580" cy="350" r="7"/><circle cx="580" cy="450" r="7"/></g>
  <path class="wire" data-from="track" data-to="track-label" d="M505 118H620V82H718"/><text class="label" x="725" y="86">дорожка</text>
  <path class="wire" data-from="heads" data-to="heads-label" d="M580 350H805"/><text class="label" x="810" y="355">головка</text>
  <path d="M520 125V425" stroke="#b4494d" stroke-width="3" stroke-dasharray="8 6"/><text class="label" x="520" y="500" text-anchor="middle" fill="#b4494d">цилиндр</text>
  <rect x="95" y="555" width="710" height="28" rx="5" fill="#f3f5f8" stroke="#c8cfdb"/><text class="small" x="450" y="574" text-anchor="middle">Все головки перемещаются совместно; выбранная поверхность задаёт нужное слово или блок</text>
</svg>
