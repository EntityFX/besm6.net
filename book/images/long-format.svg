<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="800" height="130">
  <style>
    text { font-family: 'Courier New', monospace; font-size: 12px; fill: #333; text-anchor: middle; dominant-baseline: middle; }
    .label { font-size: 10px; fill: #666; }
    .title { font-size: 13px; font-weight: bold; fill: #222; }
  </style>
  <text x="400" y="18" class="title">Длинноадресный формат команды (бит 20 = "1")</text>
  <!-- Bit numbers -->
  <text x="380" y="40" class="label">24-21</text>
  <text x="420" y="40" class="label">20</text>
  <text x="455" y="40" class="label">19-16</text>
  <text x="580" y="40" class="label">15-1</text>
  <!-- Blocks -->
  <rect x="340" y="45" width="80" height="30" rx="3" fill="#F5A623" stroke="#C47A10" stroke-width="1.5"/>
  <rect x="420" y="45" width="25" height="30" rx="3" fill="#D0021B" stroke="#8B0010" stroke-width="1.5"/>
  <rect x="445" y="45" width="100" height="30" rx="3" fill="#4A90D9" stroke="#2C5F8A" stroke-width="1.5"/>
  <rect x="545" y="45" width="225" height="30" rx="3" fill="#7BC47F" stroke="#4A8C4E" stroke-width="1.5"/>
  <!-- Labels -->
  <text x="380" y="66" fill="white" font-weight="bold">i</text>
  <text x="432" y="66" fill="white" font-weight="bold">1</text>
  <text x="495" y="66" fill="white" font-weight="bold">КоП</text>
  <text x="657" y="66" fill="white" font-weight="bold">Полный адрес</text>
  <!-- Bottom labels -->
  <text x="380" y="90" class="label">индекс-регистр</text>
  <text x="432" y="90" class="label">признак</text>
  <text x="495" y="90" class="label">код операции (4 бита)</text>
  <text x="657" y="90" class="label">полный адрес (15 бит)</text>
  <!-- Note -->
  <text x="400" y="115" class="label" fill="#888">Адресует до 32768 ячеек памяти напрямую</text>
</svg>