<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" data-theme="color" role="img" aria-labelledby="title desc">
  <title id="title">Длинноадресный формат команды БЭСМ-6</title>
  <desc id="desc">Поля 24-разрядной команды: четыре бита модификатора, единичный признак формата, четыре бита кода операции и полный пятнадцатибитный адрес.</desc>
  <defs><style>
    text{font-family:"Segoe UI",Arial,sans-serif;fill:#172033;text-anchor:middle}.title{font-size:24px;font-weight:700}.range{font-size:14px;font-weight:650}.main{font-size:19px;font-weight:700;fill:#fff}.sub{font-size:13px;fill:#44506a}.cell{stroke:#172033;stroke-width:2;vector-effect:non-scaling-stroke}
  </style></defs>
  <rect width="1000" height="250" fill="#fff"/><text class="title" x="500" y="34">Длинноадресный формат команды</text>
  <text class="range" x="137" y="74">24–21</text><text class="range" x="240" y="74">20</text><text class="range" x="342" y="74">19–16</text><text class="range" x="670" y="74">15–1</text>
  <rect class="cell" x="70" y="86" width="135" height="66" rx="5" fill="#d18b28"/><rect class="cell" x="205" y="86" width="70" height="66" fill="#b4494d"/><rect class="cell" x="275" y="86" width="135" height="66" fill="#4169a8"/><rect class="cell" x="410" y="86" width="520" height="66" rx="5" fill="#368873"/>
  <text class="main" x="137" y="127">M</text><text class="main" x="240" y="127">1</text><text class="main" x="342" y="127">КОП</text><text class="main" x="670" y="127">ПОЛНЫЙ АДРЕС</text>
  <text class="sub" x="137" y="178">модификатор, 4 бита</text><text class="sub" x="240" y="178">формат</text><text class="sub" x="342" y="178">4 бита</text><text class="sub" x="670" y="178">15 бит</text>
  <rect x="70" y="205" width="860" height="30" rx="5" fill="#f3f5f8" stroke="#c8cfdb"/><text class="sub" x="500" y="225">Исполнительный адрес = (полный адрес + M) mod 2¹⁵</text>
</svg>
