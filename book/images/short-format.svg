<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" data-theme="color" role="img" aria-labelledby="title desc">
  <title id="title">Короткоадресный формат команды БЭСМ-6</title>
  <desc id="desc">Поля 24-разрядной команды: четыре бита модификатора, нулевой признак формата, бит расширения адреса, шесть бит кода операции и двенадцать бит адреса.</desc>
  <defs><style>
    text{font-family:"Segoe UI",Arial,sans-serif;fill:#172033;text-anchor:middle}.title{font-size:24px;font-weight:700}.range{font-size:14px;font-weight:650}.main{font-size:19px;font-weight:700;fill:#fff}.dark{fill:#172033}.sub{font-size:13px;fill:#44506a}.cell{stroke:#172033;stroke-width:2;vector-effect:non-scaling-stroke}
  </style></defs>
  <rect width="1000" height="250" fill="#fff"/><text class="title" x="500" y="34">Короткоадресный формат команды</text>
  <text class="range" x="137" y="74">24–21</text><text class="range" x="240" y="74">20</text><text class="range" x="310" y="74">19</text><text class="range" x="430" y="74">18–13</text><text class="range" x="722" y="74">12–1</text>
  <rect class="cell" x="70" y="86" width="135" height="66" rx="5" fill="#d18b28"/><rect class="cell" x="205" y="86" width="70" height="66" fill="#b4494d"/><rect class="cell" x="275" y="86" width="70" height="66" fill="#f1ca4b"/><rect class="cell" x="345" y="86" width="170" height="66" fill="#4169a8"/><rect class="cell" x="515" y="86" width="415" height="66" rx="5" fill="#368873"/>
  <text class="main" x="137" y="127">M</text><text class="main" x="240" y="127">0</text><text class="main dark" x="310" y="127">S</text><text class="main" x="430" y="127">КОП</text><text class="main" x="722" y="127">АДРЕС</text>
  <text class="sub" x="137" y="178">модификатор, 4 бита</text><text class="sub" x="240" y="178">формат</text><text class="sub" x="310" y="178">расширение</text><text class="sub" x="430" y="178">6 бит</text><text class="sub" x="722" y="178">12 бит</text>
  <rect x="70" y="205" width="860" height="30" rx="5" fill="#f3f5f8" stroke="#c8cfdb"/><text class="sub" x="500" y="225">S=0: 000₂ + адрес; S=1: 111₂ + адрес; затем прибавляется M</text>
</svg>
