<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" data-theme="color" role="img" aria-labelledby="title desc">
  <title id="title">Функциональная архитектура БЭСМ-6</title>
  <desc id="desc">Устройство управления выбирает команды, устройство выборки получает операнды, два арифметических тракта исполняют операции, а устройство записи сохраняет результат в памяти.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" overflow="visible" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 1L12 6 0 11Z" fill="#5a6475"/></marker>
    <style>
      text{font-family:"Segoe UI",Arial,sans-serif;text-anchor:middle;fill:#172033}.title{font-size:26px;font-weight:700}.sub{font-size:15px;fill:#5a6475}.name{font-size:18px;font-weight:700;fill:#fff}.detail{font-size:13px;fill:#eef2f7}
      .box{stroke-width:2.5;vector-effect:non-scaling-stroke}.wire{fill:none;stroke:#5a6475;stroke-width:2.5;marker-end:url(#arrow);vector-effect:non-scaling-stroke}.bus{fill:none;stroke:#5a6475;stroke-width:3;vector-effect:non-scaling-stroke}
    </style>
  </defs>
  <rect width="1000" height="600" fill="#fff"/><text class="title" x="500" y="38">Функциональная архитектура БЭСМ-6</text>
  <text class="sub" x="500" y="63">Параллельные специализированные тракты центральной части</text>

  <rect class="box" x="350" y="90" width="300" height="76" rx="10" fill="#4169a8" stroke="#27466f"/>
  <text class="name" x="500" y="120">УСТРОЙСТВО УПРАВЛЕНИЯ · УУ</text><text class="detail" x="500" y="144">выборка команды · декодирование · адресация</text>
  <rect class="box" x="350" y="215" width="300" height="76" rx="10" fill="#368873" stroke="#215f50"/>
  <text class="name" x="500" y="245">УСТРОЙСТВО ВЫБОРКИ · УВ</text><text class="detail" x="500" y="269">чтение операндов из оперативной памяти</text>

  <rect class="box" x="90" y="360" width="350" height="82" rx="10" fill="#d18b28" stroke="#995f13"/>
  <text class="name" x="265" y="391">АДДИТИВНОЕ АУ</text><text class="detail" x="265" y="417">сложение · вычитание · логические операции</text>
  <rect class="box" x="560" y="360" width="350" height="82" rx="10" fill="#b4494d" stroke="#7d3034"/>
  <text class="name" x="735" y="391">МУЛЬТИПЛИКАТИВНОЕ АУ</text><text class="detail" x="735" y="417">умножение · деление · сдвиги</text>
  <rect class="box" x="350" y="492" width="300" height="68" rx="10" fill="#76559d" stroke="#50386d"/>
  <text class="name" x="500" y="519">УСТРОЙСТВО ЗАПИСИ · УЗ</text><text class="detail" x="500" y="542">запись результата в ОЗУ</text>

  <path class="wire" data-from="control" data-to="fetch" data-contact="500,215" d="M500 166V215"/>
  <path class="bus" d="M500 291V325H265V348M500 325H735V348"/>
  <path class="wire" data-from="fetch" data-to="additive-alu" data-contact="265,360" d="M265 325V360"/>
  <path class="wire" data-from="fetch" data-to="multiplicative-alu" data-contact="735,360" d="M735 325V360"/>
  <path class="bus" d="M265 442V466H500M735 442V466H500"/>
  <path class="wire" data-from="alus" data-to="write" data-contact="500,492" d="M500 466V492"/>

  <rect x="70" y="90" width="210" height="76" rx="10" fill="#f3f5f8" stroke="#aeb8c7" stroke-width="2"/><text x="175" y="120" font-size="17" font-weight="700">ОПЕРАТИВНАЯ ПАМЯТЬ</text><text class="sub" x="175" y="145">4 расслоенных банка</text>
  <path class="wire" data-from="memory" data-to="control" data-contact="350,112" d="M280 112H350"/><path class="wire" data-from="memory" data-to="fetch" data-contact="350,253" d="M280 146H320V253H350"/>
</svg>
