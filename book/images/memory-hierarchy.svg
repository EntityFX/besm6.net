<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" data-theme="color" role="img" aria-labelledby="title desc">
  <title id="title">Иерархия памяти БЭСМ-6</title>
  <desc id="desc">От быстрых регистров и оперативной памяти к барабанам, дискам и магнитным лентам; вниз растут ёмкость и время доступа.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" overflow="visible" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 1L12 6 0 11Z" fill="#5a6475"/></marker>
    <style>text{font-family:"Segoe UI",Arial,sans-serif;text-anchor:middle;fill:#172033}.title{font-size:26px;font-weight:700}.name{font-size:18px;font-weight:700;fill:#fff}.detail{font-size:13px;fill:#eef2f7}.side{font-size:15px;fill:#5a6475}.box{stroke-width:2.5}.wire{stroke:#5a6475;stroke-width:2.2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="800" height="650" fill="#fff"/><text class="title" x="400" y="38">Иерархия памяти БЭСМ-6</text>
  <rect class="box" x="235" y="82" width="330" height="72" rx="10" fill="#b4494d" stroke="#7d3034"/><text class="name" x="400" y="111">РЕГИСТРЫ И БЫСТРАЯ ПАМЯТЬ</text><text class="detail" x="400" y="136">минимальная задержка · минимальная ёмкость</text>
  <rect class="box" x="185" y="188" width="430" height="72" rx="10" fill="#d18b28" stroke="#995f13"/><text class="name" x="400" y="217">ОПЕРАТИВНАЯ ПАМЯТЬ</text><text class="detail" x="400" y="242">32K слов · 48 разрядов · расслоение</text>
  <rect class="box" x="145" y="294" width="510" height="72" rx="10" fill="#368873" stroke="#215f50"/><text class="name" x="400" y="323">МАГНИТНЫЕ БАРАБАНЫ</text><text class="detail" x="400" y="348">быстрый циклический блочный доступ</text>
  <rect class="box" x="105" y="400" width="590" height="72" rx="10" fill="#4169a8" stroke="#27466f"/><text class="name" x="400" y="429">МАГНИТНЫЕ ДИСКИ</text><text class="detail" x="400" y="454">прямой доступ · сменные пакеты</text>
  <rect class="box" x="65" y="506" width="670" height="72" rx="10" fill="#76559d" stroke="#50386d"/><text class="name" x="400" y="535">МАГНИТНЫЕ ЛЕНТЫ</text><text class="detail" x="400" y="560">последовательный доступ · архивы и библиотеки</text>
  <path class="wire" data-from="registers" data-to="ram" data-contact="400,188" d="M400 154V188"/><path class="wire" data-from="ram" data-to="drums" data-contact="400,294" d="M400 260V294"/><path class="wire" data-from="drums" data-to="disks" data-contact="400,400" d="M400 366V400"/><path class="wire" data-from="disks" data-to="tapes" data-contact="400,506" d="M400 472V506"/>
  <text class="side" x="690" y="108">быстрее</text><text class="side" x="690" y="136">меньше</text><text class="side" x="690" y="610">медленнее · больше</text>
  <path d="M690 155V506" fill="none" stroke="#aeb8c7" stroke-width="2" marker-end="url(#arrow)" data-from="fast" data-to="large" data-contact="690,506"/>
</svg>
