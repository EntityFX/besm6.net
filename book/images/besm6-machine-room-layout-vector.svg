<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1920" height="900" viewBox="0 0 1920 900" role="img"
     aria-labelledby="title desc">
  <title id="title">Схема размещения оборудования вычислительного комплекса БЭСМ-6</title>
  <desc id="desc">Чистовая векторная реконструкция исторического плана машинного зала с накопителями, магнитными барабанами, центральными устройствами и стойками памяти.</desc>

  <defs>
    <pattern id="grid" width="62" height="60" patternUnits="userSpaceOnUse">
      <path d="M62 0H0V60" fill="none" stroke="#999" stroke-width="1.2"/>
    </pattern>
    <style>
      .outer { fill: #fff; stroke: #111; stroke-width: 3; }
      .room  { fill: url(#grid); stroke: #111; stroke-width: 3; }
      .cab   { fill: #fff; stroke: #111; stroke-width: 2.5; }
      .rack  { fill: #f7f7f7; stroke: #111; stroke-width: 2.5; }
      .link  { fill: none; stroke: #111; stroke-width: 2.2; stroke-linejoin: round; }
      .t { font-family: "Segoe UI", Arial, sans-serif; font-weight: 650; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .s { font-size: 17px; }
      .m { font-size: 21px; }
      .l { font-size: 27px; }
      .note { font-family: "Segoe UI", Arial, sans-serif; font-size: 20px; font-style: italic; fill: #111; text-anchor: middle; }
    </style>
    <g id="nsmd"><rect class="cab" width="64" height="54" rx="2"/><text class="t s" x="32" y="28">НСМД</text></g>
    <g id="mb"><rect class="cab" width="64" height="60" rx="2"/><text class="t l" x="32" y="31">МБ</text></g>
    <g id="tape"><rect class="cab" width="48" height="40" rx="2"/><text class="t s" x="24" y="21">НА</text></g>
    <g id="mozu"><rect class="cab" width="59" height="40" rx="2"/><text class="t s" x="29.5" y="21">МОЗУ</text></g>
  </defs>

  <rect class="outer" x="22" y="14" width="1876" height="840"/>
  <rect class="room" x="82" y="35" width="1750" height="760"/>

  <!-- Left: disk and drum equipment -->
  <g>
    <use xlink:href="#nsmd" x="175" y="112"/><use xlink:href="#nsmd" x="239" y="112"/>
    <use xlink:href="#nsmd" x="303" y="112"/><use xlink:href="#nsmd" x="367" y="112"/>
    <use xlink:href="#nsmd" x="431" y="112"/><use xlink:href="#nsmd" x="495" y="112"/>
    <use xlink:href="#nsmd" x="559" y="112"/><use xlink:href="#nsmd" x="623" y="112"/>
    <use xlink:href="#nsmd" x="175" y="230"/><use xlink:href="#nsmd" x="239" y="230"/>
    <use xlink:href="#nsmd" x="303" y="230"/><use xlink:href="#nsmd" x="367" y="230"/>
    <use xlink:href="#nsmd" x="431" y="230"/><use xlink:href="#nsmd" x="495" y="230"/>
    <use xlink:href="#nsmd" x="559" y="230"/><use xlink:href="#nsmd" x="623" y="230"/>
  </g>

  <rect class="cab" x="745" y="92" width="52" height="132"/>
  <text class="t m" x="771" y="158" transform="rotate(-90 771 158)">СП НМД</text>

  <g>
    <use xlink:href="#mb" x="236" y="350"/><use xlink:href="#mb" x="360" y="350"/>
    <use xlink:href="#mb" x="484" y="350"/><use xlink:href="#mb" x="608" y="350"/>
    <use xlink:href="#mb" x="236" y="470"/><use xlink:href="#mb" x="360" y="470"/>
    <use xlink:href="#mb" x="484" y="470"/><use xlink:href="#mb" x="608" y="470"/>
    <use xlink:href="#mb" x="236" y="590"/><use xlink:href="#mb" x="360" y="590"/>
    <use xlink:href="#mb" x="484" y="590"/><use xlink:href="#mb" x="608" y="590"/>
    <use xlink:href="#mb" x="236" y="710"/><use xlink:href="#mb" x="360" y="710"/>
    <use xlink:href="#mb" x="484" y="710"/><use xlink:href="#mb" x="608" y="710"/>
  </g>
  <rect class="cab" x="744" y="391" width="54" height="72"/><text class="t m" x="771" y="427" transform="rotate(-90 771 427)">КМБ</text>
  <rect class="cab" x="744" y="622" width="54" height="72"/><text class="t m" x="771" y="658" transform="rotate(-90 771 658)">КМБ</text>

  <!-- Upper tape rows -->
  <text class="t m" x="1115" y="92">НМЛ ЕС-5017</text>
  <g>
    <use xlink:href="#tape" x="960" y="117"/><use xlink:href="#tape" x="1008" y="117"/>
    <use xlink:href="#tape" x="1056" y="117"/><use xlink:href="#tape" x="1104" y="117"/>
    <use xlink:href="#tape" x="1152" y="117"/><use xlink:href="#tape" x="1200" y="117"/>
    <use xlink:href="#tape" x="1248" y="117"/><use xlink:href="#tape" x="1296" y="117"/>
  </g>

  <text class="t m" x="1515" y="92">НМЛ БЭСМ-6</text>
  <g>
    <use xlink:href="#tape" x="1370" y="117"/><use xlink:href="#tape" x="1418" y="117"/>
    <use xlink:href="#tape" x="1466" y="117"/><use xlink:href="#tape" x="1514" y="117"/>
    <use xlink:href="#tape" x="1562" y="117"/><use xlink:href="#tape" x="1610" y="117"/>
    <use xlink:href="#tape" x="1658" y="117"/><use xlink:href="#tape" x="1706" y="117"/>
  </g>

  <!-- Auxiliary cabinets -->
  <rect class="cab" x="998" y="265" width="82" height="52"/><text class="t m" x="1039" y="291">КВУМ</text>
  <rect class="cab" x="1138" y="265" width="72" height="52"/><text class="t s" x="1174" y="282">АЦПУ</text><text class="t s" x="1174" y="302">121-3</text>
  <rect class="cab" x="1260" y="265" width="72" height="52"/><text class="t s" x="1296" y="282">АЦПУ</text><text class="t s" x="1296" y="302">121-3</text>
  <rect class="cab" x="1147" y="354" width="56" height="40"/><text class="t s" x="1175" y="375">ПО</text>
  <rect class="cab" x="1070" y="446" width="48" height="48"/><text class="t s" x="1094" y="471">ПП</text>

  <rect class="cab" x="918" y="444" width="56" height="168"/>
  <text class="t m" x="946" y="528" transform="rotate(-90 946 528)">СП ПУ</text>

  <g>
    <rect class="cab" x="1370" y="264" width="42" height="70"/><text class="t s" x="1391" y="299" transform="rotate(-90 1391 299)">УП</text>
    <rect class="cab" x="1455" y="264" width="42" height="70"/><text class="t s" x="1476" y="299" transform="rotate(-90 1476 299)">ВП</text>
    <rect class="cab" x="1540" y="264" width="42" height="70"/><text class="t s" x="1561" y="299" transform="rotate(-90 1561 299)">ПЛ</text>
    <rect class="cab" x="1625" y="264" width="42" height="70"/><text class="t s" x="1646" y="299" transform="rotate(-90 1646 299)">ПВ</text>
  </g>

  <!-- Central processor bay, redrawn as segmented cabinets -->
  <g transform="translate(1180 438)">
    <path class="rack" d="M0 0 L48 0 L84 42 L50 100 L12 70 Z"/>
    <path class="rack" d="M48 0 L96 0 L126 38 L84 42 Z"/>
    <path class="rack" d="M84 42 L126 38 L168 42 L126 82 L50 100 Z"/>
    <path class="rack" d="M168 42 L198 0 L246 0 L234 70 L200 100 Z"/>
    <path class="rack" d="M126 82 L168 42 L200 100 L172 130 L126 114 Z"/>
    <path class="rack" d="M50 100 L126 82 L126 114 L80 130 Z"/>
    <text class="t m" x="35" y="49" transform="rotate(62 35 49)">УВУ</text>
    <text class="t m" x="221" y="48" transform="rotate(-62 221 48)">РУСК</text>
    <text class="t m" x="102" y="105">АУ</text>
    <text class="t m" x="154" y="109">УУ</text>
  </g>

  <!-- Main-memory cabinets -->
  <g>
    <use xlink:href="#mozu" x="1490" y="445"/><use xlink:href="#mozu" x="1549" y="445"/>
    <use xlink:href="#mozu" x="1608" y="445"/><use xlink:href="#mozu" x="1667" y="445"/>

    <use xlink:href="#mozu" x="1450" y="560"/><use xlink:href="#mozu" x="1509" y="560"/>
    <use xlink:href="#mozu" x="1568" y="560"/><use xlink:href="#mozu" x="1627" y="560"/>
    <rect class="cab" x="1686" y="560" width="76" height="40"/><text class="t s" x="1724" y="581">СП МОЗУ</text>

    <use xlink:href="#mozu" x="1167" y="675"/><use xlink:href="#mozu" x="1226" y="675"/>
    <use xlink:href="#mozu" x="1285" y="675"/><use xlink:href="#mozu" x="1344" y="675"/>

    <use xlink:href="#mozu" x="1450" y="675"/><use xlink:href="#mozu" x="1509" y="675"/>
    <use xlink:href="#mozu" x="1568" y="675"/><use xlink:href="#mozu" x="1627" y="675"/>
    <rect class="cab" x="1686" y="675" width="76" height="40"/><text class="t s" x="1724" y="696">СП МОЗУ</text>
  </g>

  <!-- Representative cable routes retained from the scan -->
  <path class="link" d="M687 139 H745 M687 257 H745 M798 427 H918 M798 658 H918"/>
  <path class="link" d="M1039 317 V438 H1180 M1174 317 V438 M1296 317 V438"/>
  <path class="link" d="M1426 503 H1490 M1426 568 H1450 M1300 568 V675"/>

  <text class="note" x="960" y="835">Рис. 6-1. Схема размещения оборудования вычислительного комплекса БЭСМ-6</text>
</svg>
