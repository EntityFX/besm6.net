map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Uploads are base64-encoded in SignalR messages (hub limit: 16 MiB).
    client_max_body_size 16m;

    # Resolve the Compose service again after a simulator container is replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $simulator http://simulator:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /simulator {
        # Relative redirects preserve the externally published port.
        absolute_redirect off;
        return 308 /simulator/$is_args$args;
    }

    location /simulator/ {
        rewrite ^/simulator/(.*)$ /$1 break;
        proxy_pass $simulator;
    }

    location /api/ {
        proxy_pass $simulator;
    }

    location = /emulator {
        proxy_pass $simulator;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /emulator/ {
        proxy_pass $simulator;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
